<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal Tasks</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #eee;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.container {
  max-width: 600px;
  margin: 40px auto;
  padding: 0 16px;
}

input {
  width: 100%;
  padding: 14px;
  background: #1a1a1a;
  border: 1px solid #222;
  color: #eee;
  font-size: 16px;
  outline: none;
}

.toolbar {
  display: flex;
  gap: 18px;
  margin: 10px 0 20px 0;
}

.toolbar button {
  background: none;
  border: none;
  color: #aaa;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  padding: 4px 2px;
}

.toolbar button:hover {
  color: #fff;
}

.task {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #1f1f1f;
  cursor: pointer;
}

.task-text {
  flex: 1;
  word-break: break-word;
  margin-right: 6px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.tag {
  color: #6fa8dc;
}

.marker {
  font-size: 11px;
  margin-right: 8px;
  color: #777;
  letter-spacing: 1px;
}

.marker.now {
  color: #ffcc66;
}

</style>
</head>
<body>

<div class="container">

<input id="taskInput" placeholder="Add task and press Enter">

<div class="toolbar">
  <button onclick="addTask()">ADD</button>
  <button onclick="exportTasks()">EXPORT</button>
  <button onclick="importTasks()">IMPORT</button>
  <button onclick="markNow()">NOW</button>
</div>

<div id="taskList"></div>

<input type="file" id="fileInput" style="display:none">

</div>

<script>

let tasks = [];
let selectedTaskIndex = null;

function renderTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task, index) => {
    const div = document.createElement("div");
    div.className = "task";
    div.onclick = () => selectedTaskIndex = index;

    if (task.now) {
      const marker = document.createElement("span");
      marker.className = "marker now";
      marker.textContent = "NOW";
      div.appendChild(marker);
    }

    const span = document.createElement("div");
    span.className = "task-text";
    span.innerHTML = formatTags(task.text);

    div.appendChild(span);
    list.appendChild(div);
  });
}

function formatTags(text) {
  return text.replace(/#(\w+)/g, '<span class="tag">#$1</span>');
}

function addTask() {
  const input = document.getElementById("taskInput");
  const value = input.value.trim();
  if (!value) return;

  tasks.unshift({ text: value, now: false });
  input.value = "";
  renderTasks();
}

function markNow() {
  if (selectedTaskIndex === null) return;
  tasks[selectedTaskIndex].now = !tasks[selectedTaskIndex].now;
  renderTasks();
}

function exportTasks() {
  const content = tasks.map(t => {
    let line = t.text;
    if (t.now) line = "[NOW] " + line;
    return line;
  }).join("\n");

  const blob = new Blob([content], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tasks.txt";
  a.click();
}

function importTasks() {
  document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    const lines = event.target.result.split("\n");

    tasks = lines.filter(l => l.trim()).map(line => {
      let now = false;

      if (line.startsWith("[NOW]")) {
        now = true;
        line = line.replace("[NOW]", "").trim();
      }

      return { text: line, now };
    });

    selectedTaskIndex = null;
    renderTasks();
  };

  reader.readAsText(file);
});

document.getElementById("taskInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") addTask();
});

/* Keyboard Shortcut: N for NOW */
document.addEventListener("keydown", function(e) {

  if (document.activeElement.id === "taskInput") return;
  if (selectedTaskIndex === null) return;

  if (e.key.toLowerCase() === "n") {
    markNow();
  }

});

renderTasks();

</script>

</body>
</html>
