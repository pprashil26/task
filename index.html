<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tool</title>

<meta name="theme-color" content="#3b2f2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #3b2f2f;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#taskInput {
  width: 92%;
  max-width: 480px;
  padding: 18px;
  font-size: 22px;
  line-height: 1.5;
  border: none;
  border-radius: 14px;
  margin-top: 14px;
  outline: none;
  background: #bbf7d0;
  color: #3b2f2f;
  font-family: inherit;
  overflow: hidden;
  resize: none;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  min-height: 32px;
  text-transform: uppercase;
}

#taskInput:focus {
  outline: 2px solid #22c55e;
  outline-offset: 2px;
}

#charCount {
  width: 92%;
  max-width: 480px;
  text-align: right;
  font-size: 12px;
  color: #ddd;
  margin-top: 4px;
  margin-bottom: 6px;
}

.toolbar {
  width: 92%;
  max-width: 480px;
  display: flex;
  gap: 6px;
  margin: 10px 0 6px;
  align-items: center;
}

.toolbar button, .toolbar input[type="text"] {
  font-size: 12px;
  text-transform: uppercase;
  border: none;
  border-radius: 10px;
  padding: 4px 8px;
  background: #4a3838;
  color: #fff;
}

.toolbar button.active {
  background: #2563eb;
}

.toolbar input[type="text"] {
  flex: 1;
}

#taskList {
  width: 92%;
  max-width: 480px;
  margin-top: 14px;
}

.task-item {
  display: flex;
  align-items: center;
  padding: 6px 4px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  font-size: 14px;
  gap: 6px;
}

.task-item.completed .task-text {
  text-decoration: line-through;
  opacity: 0.6;
}

.task-text {
  flex: 1;
  word-break: break-word;
  text-transform: uppercase;
  line-height: 1.3;
}

.task-text .tag {
  color: #a8f0c6;
  font-weight: 500;
}

.task-date {
  font-size: 10px;
  color: #aaa;
  white-space: nowrap;
  margin-left: 4px;
}

.task-controls {
  display: flex;
  align-items: center;
  gap: 2px;
}

.task-controls input[type="checkbox"] {
  width: 14px;
  height: 14px;
  accent-color: #ffffff;
}

.task-controls button {
  border: none;
  background: transparent;
  border-radius: 50%;
  width: 22px;
  height: 22px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  color: #ffffff;
  cursor: pointer;
}

.task-controls button svg {
  width: 14px;
  height: 14px;
  pointer-events: none;
}

.task-controls button svg path,
.task-controls button svg line {
  stroke: currentColor;
  fill: currentColor;
}

.task-controls button.pinned.active {
  color: #38bdf8;
}
</style>
</head>
<body>

<textarea id="taskInput" placeholder="Task description (use #tags inline)…" maxlength="160"></textarea>
<div id="charCount">160</div>

<div class="toolbar">
  <button id="addTaskBtn">Add</button>
  <button id="exportTasksBtn">Export</button>
  <button id="importTasksBtn">Import</button>
  <button id="filterPinnedBtn">Now</button>
  <input type="text" id="searchInput" placeholder="Search…">
  <input type="file" id="importFileInput" style="display:none;">
</div>

<div id="taskList"></div>
<div id="mirror" style="position:absolute; top:-9999px; left:-9999px; visibility:hidden; white-space: pre-wrap;"></div>

<script>
const taskInput = document.getElementById('taskInput');
const charCount = document.getElementById('charCount');
const addTaskBtn = document.getElementById('addTaskBtn');
const taskList = document.getElementById('taskList');
const mirror = document.getElementById('mirror');

const exportTasksBtn = document.getElementById('exportTasksBtn');
const importTasksBtn = document.getElementById('importTasksBtn');
const importFileInput = document.getElementById('importFileInput');
const filterPinnedBtn = document.getElementById('filterPinnedBtn');
const searchInput = document.getElementById('searchInput');

let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let filters = { pinned: false };
let searchQuery = '';

function saveTasks() { localStorage.setItem('tasks', JSON.stringify(tasks)); }
function escapeHTML(str) { return str.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function parseTagsHTML(text) { return escapeHTML(text).replace(/(#\w+)/g, '<span class="tag">$1</span>'); }
function updateCharCount() { charCount.textContent = 160 - taskInput.value.length; }

function autoGrow() {
  mirror.style.width = taskInput.offsetWidth + 'px';
  mirror.style.font = window.getComputedStyle(taskInput).font;
  mirror.style.lineHeight = window.getComputedStyle(taskInput).lineHeight;
  mirror.style.padding = window.getComputedStyle(taskInput).padding;
  mirror.textContent = taskInput.value || taskInput.placeholder;
  taskInput.style.height = mirror.scrollHeight + 'px';
}

autoGrow();
taskInput.addEventListener('input', () => { updateCharCount(); autoGrow(); });
taskInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    addTask();
  }
});

function createTask(text) {
  return {
    id: Date.now(),
    text: text.trim(),
    tags: (text.match(/#\w+/g) || []).map(t => t.trim()),
    completed: false,
    pinned: false,
    createdAt: Date.now()
  };
}

function renderTasks() {
  taskList.innerHTML = '';
  let filteredTasks = [...tasks];

  if (filters.pinned) filteredTasks = filteredTasks.filter(t => t.pinned);
  if (searchQuery) filteredTasks = filteredTasks.filter(t => t.text.toUpperCase().includes(searchQuery.toUpperCase()));

  filteredTasks.sort((a, b) => {
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    return b.createdAt - a.createdAt;
  });

  filteredTasks.forEach(task => {
    const div = document.createElement('div');
    div.className = 'task-item';
    if (task.completed) div.classList.add('completed');

    const span = document.createElement('span');
    span.className = 'task-text';
    span.innerHTML = parseTagsHTML(task.text);

    const dateSpan = document.createElement('span');
    dateSpan.className = 'task-date';
    const d = new Date(task.createdAt);
    dateSpan.textContent = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

    const controls = document.createElement('div');
    controls.className = 'task-controls';

    const pinBtn = document.createElement('button');
    pinBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2L15 8L22 9L17 14L18 21L12 18L6 21L7 14L2 9L9 8Z"></path></svg>';
    pinBtn.classList.toggle('active', task.pinned);
    pinBtn.onclick = () => { task.pinned = !task.pinned; saveTasks(); renderTasks(); };

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = task.completed;
    checkbox.onclick = () => { task.completed = !task.completed; saveTasks(); renderTasks(); };

    const copyBtn = document.createElement('button');
    copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 2h10a2 2 0 0 1 2 2v14h-2V4H6V2zM4 6h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm2 2v12h10V8H6z"/></svg>';
    copyBtn.onclick = () => navigator.clipboard.writeText(task.text.toUpperCase());

    const delBtn = document.createElement('button');
    delBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6"/></svg>';
    delBtn.onclick = () => {
      if (!confirm("Are you sure you want to delete this task?")) return;
      tasks = tasks.filter(t => t.id !== task.id);
      saveTasks();
      renderTasks();
    };

    controls.appendChild(pinBtn);
    controls.appendChild(checkbox);
    controls.appendChild(copyBtn);
    controls.appendChild(delBtn);

    div.appendChild(span);
    div.appendChild(dateSpan);
    div.appendChild(controls);
    taskList.appendChild(div);
  });
}

function resetTaskInput() {
  taskInput.value = '';
  updateCharCount();
  requestAnimationFrame(() => {
    taskInput.scrollTop = 0;
    taskInput.selectionStart = taskInput.selectionEnd = 0;
    autoGrow();
    taskInput.focus();
  });
}

function addTask() {
  const text = taskInput.value.trim();
  if (!text) return;
  tasks.unshift(createTask(text));
  saveTasks();
  renderTasks();
  resetTaskInput();
}

addTaskBtn.onclick = addTask;

filterPinnedBtn.onclick = () => {
  filters.pinned = !filters.pinned;
  filterPinnedBtn.classList.toggle('active', filters.pinned);
  renderTasks();
};

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  renderTasks();
});

renderTasks();
updateCharCount();
</script>

</body>
</html>
