<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tool</title>

<meta name="theme-color" content="#3b2f2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #3b2f2f;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#taskInput {
  width: 92%;
  max-width: 480px;
  padding: 18px;
  font-size: 22px;
  line-height: 1.5;
  border: none;
  border-radius: 14px;
  margin-top: 14px;
  outline: none;
  background: #bbf7d0;
  color: #3b2f2f;
  font-family: inherit;
  overflow: hidden;
  resize: none;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  min-height: 32px;
  text-transform: uppercase; /* all tasks in caps */
}

#taskInput:focus {
  outline: 2px solid #22c55e;
  outline-offset: 2px;
}

#charCount {
  width: 92%;
  max-width: 480px;
  text-align: right;
  font-size: 12px;
  color: #ddd;
  margin-top: 4px;
  margin-bottom: 6px;
}

.toolbar {
  width: 92%;
  max-width: 480px;
  display: flex;
  gap: 6px;
  margin: 10px 0 6px;
  align-items: center;
}

.toolbar button {
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 400;
  text-transform: uppercase;
  border: none;
  border-radius: 10px;
  background: #4a3838;
  color: #fff;
  cursor: pointer;
}

.toolbar button.active {
  background: #2563eb;
}

#taskList {
  width: 92%;
  max-width: 480px;
  margin-top: 14px;
}

.task-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 6px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  font-size: 14px;
}

.task-item.completed .task-text {
  text-decoration: line-through;
  opacity: 0.6;
}

.task-text {
  flex: 1;
  word-break: break-word;
  margin-right: 6px;
  text-transform: uppercase; /* all tasks in caps */
}

.task-text .tag {
  color: #a8f0c6;
  font-weight: 500;
}

.task-date {
  font-size: 10px;
  color: #ddd;
  margin-left: 6px;
}

.task-controls {
  display: flex;
  align-items: center;
  gap: 4px;
}

.task-controls input[type="checkbox"] {
  width: 14px;
  height: 14px;
  accent-color: #ffffff;
}

.task-controls button {
  border: none;
  background: transparent;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  color: #ffffff;
}

.task-controls button svg {
  width: 16px;
  height: 16px;
  pointer-events: none;
}

/* Force icons to follow button color */
.task-controls button svg path,
.task-controls button svg line,
.task-controls button svg polyline {
  stroke: currentColor;
  fill: currentColor;
}

/* Active state for pinned/do later */
.task-controls button.pinned.active,
.task-controls button.doLater.active {
  color: #38bdf8;
}

/* --- Focus Mode --- */
body.focus-mode #taskList,
body.focus-mode #charCount,
body.focus-mode #mirror {
  display: none;
}

body.focus-mode #taskInput {
  margin-top: 40vh; /* vertically center input */
}
</style>
</head>
<body>

<textarea id="taskInput" placeholder="Task description (use #tags inline)…" maxlength="160"></textarea>
<div id="charCount">160</div>

<div class="toolbar">
  <button id="addTaskBtn">Add</button>
  <button id="exportTasksBtn">Export</button>
  <button id="importTasksBtn">Import</button>
  <button id="filterPinnedBtn">Now</button>
  <input type="text" id="searchInput" placeholder="Search…" style="flex:1; padding:4px 6px; border-radius:10px; border:none; font-size:12px;">
  <input type="file" id="importFileInput" style="display:none;">
  <button id="focusBtn">Focus</button>
</div>

<div id="taskList"></div>
<div id="mirror" style="position:absolute; top:-9999px; left:-9999px; visibility:hidden; white-space: pre-wrap; word-wrap: break-word;"></div>

<script>
const taskInput = document.getElementById('taskInput');
const charCount = document.getElementById('charCount');
const addTaskBtn = document.getElementById('addTaskBtn');
const taskList = document.getElementById('taskList');
const mirror = document.getElementById('mirror');

const exportTasksBtn = document.getElementById('exportTasksBtn');
const importTasksBtn = document.getElementById('importTasksBtn');
const importFileInput = document.getElementById('importFileInput');

const filterPinnedBtn = document.getElementById('filterPinnedBtn');
const searchInput = document.getElementById('searchInput');
const focusBtn = document.getElementById('focusBtn');

let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let filters = { pinned: false };

function saveTasks() {
  localStorage.setItem('tasks', JSON.stringify(tasks));
}

function escapeHTML(str) {
  return str.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function parseTagsHTML(text) {
  return escapeHTML(text).replace(/(#\w+)/g, '<span class="tag">$1</span>');
}

function formatDate(ts) {
  const d = new Date(ts);
  return `${d.getDate()}/${d.getMonth()+1}`; // short format day/month
}

function updateCharCount() {
  charCount.textContent = 160 - taskInput.value.length;
}

function autoGrow() {
  mirror.style.width = taskInput.offsetWidth + 'px';
  mirror.style.font = window.getComputedStyle(taskInput).font;
  mirror.style.lineHeight = window.getComputedStyle(taskInput).lineHeight;
  mirror.style.padding = window.getComputedStyle(taskInput).padding;
  mirror.style.border = window.getComputedStyle(taskInput).border;
  mirror.textContent = taskInput.value || taskInput.placeholder;
  taskInput.style.height = mirror.scrollHeight + 'px';
}

autoGrow();
taskInput.addEventListener('input', () => {
  updateCharCount();
  autoGrow();
});

taskInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') {
    if(e.shiftKey) return;
    e.preventDefault();
    addTask();
  }
});

function createTask(text) {
  return {
    id: Date.now(),
    text: text.trim(),
    tags: (text.match(/#\w+/g) || []).map(t => t.trim()),
    completed: false,
    pinned: false,
    doLater: false,
    createdAt: Date.now()
  };
}

function renderTasks() {
  taskList.innerHTML = '';

  let filteredTasks = [...tasks];
  if(filters.pinned) filteredTasks = filteredTasks.filter(t => t.pinned);

  const searchTerm = searchInput.value.trim().toUpperCase();
  if(searchTerm) filteredTasks = filteredTasks.filter(t => t.text.toUpperCase().includes(searchTerm));

  filteredTasks.sort((a,b) => {
    if(a.pinned && !b.pinned) return -1;
    if(!a.pinned && b.pinned) return 1;
    if(a.doLater && !b.doLater) return 1;
    if(!a.doLater && b.doLater) return -1;
    return b.createdAt - a.createdAt;
  });

  filteredTasks.forEach(task => {
    const div = document.createElement('div');
    div.className = 'task-item';
    if(task.completed) div.classList.add('completed');

    const span = document.createElement('span');
    span.className = 'task-text';
    span.innerHTML = parseTagsHTML(task.text);

    const dateSpan = document.createElement('span');
    dateSpan.className = 'task-date';
    dateSpan.textContent = formatDate(task.createdAt);

    const controls = document.createElement('div');
    controls.className = 'task-controls';

    const pinBtn = document.createElement('button');
    pinBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2L15 8L22 9L17 14L18 21L12 18L6 21L7 14L2 9L9 8Z"></path></svg>';
    pinBtn.classList.toggle('pinned', task.pinned);
    pinBtn.classList.toggle('active', task.pinned);
    pinBtn.onclick = () => {
      task.pinned = !task.pinned;
      saveTasks();
      renderTasks();
    };

    const doLaterBtn = document.createElement('button');
    doLaterBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
    doLaterBtn.classList.toggle('doLater', task.doLater);
    doLaterBtn.classList.toggle('active', task.doLater);
    doLaterBtn.onclick = () => {
      task.doLater = !task.doLater;
      saveTasks();
      renderTasks();
    };

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = task.completed;
    checkbox.onclick = () => {
      task.completed = !task.completed;
      saveTasks();
      renderTasks();
    };

    const copyBtn = document.createElement('button');
    copyBtn.textContent = 'C';
    copyBtn.title = 'Copy';
    copyBtn.onclick = () => navigator.clipboard.writeText(task.text.toUpperCase());

    const delBtn = document.createElement('button');
    delBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6"/></svg>';
    delBtn.onclick = () => {
      if(!confirm("Are you sure you want to delete this task?")) return;
      tasks = tasks.filter(t => t.id !== task.id);
      saveTasks();
      renderTasks();
    };

    controls.appendChild(pinBtn);
    controls.appendChild(doLaterBtn);
    controls.appendChild(checkbox);
    controls.appendChild(copyBtn);
    controls.appendChild(delBtn);

    div.appendChild(span);
    div.appendChild(dateSpan);
    div.appendChild(controls);
    taskList.appendChild(div);
  });
}

function resetTaskInput() {
  taskInput.value = '';
  updateCharCount();
  requestAnimationFrame(() => {
    taskInput.scrollTop = 0;
    taskInput.selectionStart = taskInput.selectionEnd = 0;
    autoGrow();
    taskInput.focus();
  });
}

function addTask() {
  const text = taskInput.value.trim();
  if(!text) return;
  tasks.unshift(createTask(text));
  saveTasks();
  renderTasks();
  resetTaskInput();
}

addTaskBtn.onclick = addTask;

exportTasksBtn.onclick = () => {
  const text = tasks.map(t => {
    let markers = [];
    if(t.pinned) markers.push('[Pinned]');
    if(t.doLater) markers.push('[Do Later]');
    if(t.completed) markers.push('[Completed]');
    let taskText = t.text.toUpperCase();
    return (markers.length ? markers.join(' ') + ' ' : '') + taskText;
  }).join('\n');
  const blob = new Blob([text], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tasks.txt';
  a.click();
  URL.revokeObjectURL(url);
};

importTasksBtn.onclick = () => importFileInput.click();

importFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split('\n').map(l => l.trim()).filter(l => l);
    lines.forEach(line => {
      let pinned = line.includes('[Pinned]');
      let doLater = line.includes('[Do Later]');
      let completed = line.includes('[Completed]');
      let text = line.replace(/\[Pinned\]|\[Do Later\]|\[Completed\]/g, '').trim();
      let task = createTask(text);
      task.pinned = pinned;
      task.doLater = doLater;
      task.completed = completed;
      tasks.unshift(task);
    });
    saveTasks();
    renderTasks();
  };
  reader.readAsText(file);
  importFileInput.value = '';
});

filterPinnedBtn.onclick = () => {
  filters.pinned = !filters.pinned;
  filterPinnedBtn.classList.toggle('active', filters.pinned);
  renderTasks();
};

focusBtn.onclick = () => {
  document.body.classList.toggle('focus-mode');
  focusBtn.classList.toggle('active', document.body.classList.contains('focus-mode'));
};

searchInput.addEventListener('input', renderTasks);

renderTasks();
updateCharCount();
</script>

</body>
</html>
